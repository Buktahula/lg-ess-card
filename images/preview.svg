<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e26"/>
      <stop offset="100%" stop-color="#15151c"/>
    </linearGradient>

    <!-- Header Icon Gradient -->
    <linearGradient id="solar-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Node Glow Gradients -->
    <radialGradient id="solar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="batt-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="grid-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="house-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <filter id="bubble-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Main Card Container -->
  <rect x="15" y="15" width="510" height="650" rx="20" fill="url(#card-bg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" filter="url(#card-shadow)"/>

  <!-- ========================================== -->
  <!-- HEADER -->
  <!-- ========================================== -->
  <g transform="translate(35, 35)">
    <!-- Icon Box -->
    <rect x="0" y="0" width="34" height="34" rx="9" fill="url(#solar-icon-grad)"/>
    <path d="M 17,9 A 4,4 0 0,1 21,13 A 4,4 0 0,1 17,17 A 4,4 0 0,1 13,13 A 4,4 0 0,1 17,9 M 17,5 L 18.8,7.8 C 18.2,7.6 17.6,7.5 17,7.5 C 16.4,7.5 15.8,7.6 15.2,7.8 L 17,5 M 10,9 L 13.5,8.7 C 13,9.1 12.6,9.6 12.3,10.2 C 12,10.8 11.8,11.4 11.7,12 L 10,9 M 17,21 L 15.2,18.2 C 15.8,18.4 16.4,18.5 17,18.5 C 17.6,18.5 18.2,18.4 18.8,18.2 L 17,21" fill="#ffffff" />
    
    <!-- Title -->
    <text x="44" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff">LG ESS Solar</text>

    <!-- Status Pill Badge -->
    <g transform="translate(315, 4)">
      <rect x="0" y="0" width="155" height="26" rx="13" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
      <circle cx="14" cy="13" r="4.5" fill="#10b981" filter="url(#glow-green)"/>
      <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#9ca3af">Normal • 50.0 Hz</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- ENERGY FLOW VISUALIZER -->
  <!-- ========================================== -->
  <g transform="translate(35, 85)">
    <!-- Flow Area Background -->
    <rect x="0" y="0" width="470" height="250" fill="none"/>

    <!-- Glow Backdrops behind Bubbles -->
    <circle cx="235" cy="50" r="45" fill="url(#solar-glow)"/>
    <circle cx="85" cy="125" r="45" fill="url(#batt-glow)"/>
    <circle cx="385" cy="125" r="45" fill="url(#grid-glow)"/>
    <circle cx="235" cy="200" r="45" fill="url(#house-glow)"/>

    <!-- Central Hub -->
    <circle cx="235" cy="125" r="18" fill="#22222b" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="235" cy="125" r="7" fill="#38bdf8"/>

    <!-- Flow Lines with Animation / Particles -->
    <!-- Solar to Center -->
    <line x1="235" y1="84" x2="235" y2="125" stroke="#eab308" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round"/>
    <polygon points="235,116 231,108 239,108" fill="#eab308"/>

    <!-- Center to Battery (Charging) -->
    <line x1="235" y1="125" x2="119" y2="125" stroke="#06b6d4" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round"/>
    <polygon points="126,125 134,121 134,129" fill="#06b6d4"/>

    <!-- Center to Grid (Selling / Einspeisung) -->
    <line x1="235" y1="125" x2="351" y2="125" stroke="#10b981" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round"/>
    <polygon points="344,125 336,121 336,129" fill="#10b981"/>

    <!-- Center to House (Consuming) -->
    <line x1="235" y1="125" x2="235" y2="166" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round"/>
    <polygon points="235,158 231,150 239,150" fill="#8b5cf6"/>

    <!-- 1. SOLAR BUBBLE (TOP) -->
    <g transform="translate(235, 50)">
      <circle cx="0" cy="0" r="33" fill="#262633" stroke="#eab308" stroke-width="2.5" filter="url(#bubble-shadow)"/>
      <path d="M 0,-14 L 2.5,-8 L 8.5,-8 L 3.5,-4 L 5.5,2 L 0,-1.5 L -5.5,2 L -3.5,-4 L -8.5,-8 L -2.5,-8 Z" fill="#eab308" transform="scale(0.8) translate(0, -6)"/>
      <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">4.85 kW</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="0.5">SOLAR</text>
    </g>

    <!-- 2. BATTERY BUBBLE (LEFT) -->
    <g transform="translate(85, 125)">
      <circle cx="0" cy="0" r="33" fill="#262633" stroke="#06b6d4" stroke-width="2.5" filter="url(#bubble-shadow)"/>
      <!-- Battery Icon -->
      <rect x="-7" y="-14" width="14" height="7" rx="1.5" fill="none" stroke="#06b6d4" stroke-width="1.2"/>
      <rect x="-2" y="-16" width="4" height="2" fill="#06b6d4"/>
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#06b6d4" text-anchor="middle">+1.45 kW</text>
      
      <!-- SoC Pill Badge -->
      <rect x="-17" y="19" width="34" height="15" rx="7.5" fill="#10b981"/>
      <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#000000" text-anchor="middle">82%</text>

      <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="0.5">BATTERIE</text>
    </g>

    <!-- 3. GRID BUBBLE (RIGHT) -->
    <g transform="translate(385, 125)">
      <circle cx="0" cy="0" r="33" fill="#262633" stroke="#10b981" stroke-width="2.5" filter="url(#bubble-shadow)"/>
      <!-- Tower Icon -->
      <path d="M -5,-12 L 0,-15 L 5,-12 L 3,-7 L 0,-9 L -3,-7 Z" fill="#10b981"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10b981" text-anchor="middle">-2.10 kW</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="0.5">EINSPEISUNG</text>
    </g>

    <!-- 4. HOUSE BUBBLE (BOTTOM) -->
    <g transform="translate(235, 200)">
      <circle cx="0" cy="0" r="33" fill="#262633" stroke="#8b5cf6" stroke-width="2.5" filter="url(#bubble-shadow)"/>
      <!-- House Icon -->
      <path d="M 0,-15 L -8,-7 L -5,-7 L -5, -1 L 5,-1 L 5,-7 L 8,-7 Z" fill="#8b5cf6"/>
      <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">1.30 kW</text>
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="0.5">VERBRAUCH</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- PV STRINGS BAR -->
  <!-- ========================================== -->
  <g transform="translate(35, 345)">
    <rect x="0" y="0" width="470" height="52" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    
    <!-- String 1 -->
    <rect x="12" y="8" width="140" height="36" rx="6" fill="rgba(0, 0, 0, 0.2)"/>
    <rect x="12" y="8" width="3" height="36" rx="1.5" fill="#eab308"/>
    <text x="24" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#9ca3af">String 1</text>
    <text x="24" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">2.45 kW</text>
    <text x="110" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#6b7280">340 V</text>

    <!-- String 2 -->
    <rect x="165" y="8" width="140" height="36" rx="6" fill="rgba(0, 0, 0, 0.2)"/>
    <rect x="165" y="8" width="3" height="36" rx="1.5" fill="#eab308"/>
    <text x="177" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#9ca3af">String 2</text>
    <text x="177" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">2.40 kW</text>
    <text x="263" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#6b7280">335 V</text>

    <!-- String 3 (Inactive/Standby Badge) -->
    <rect x="318" y="8" width="140" height="36" rx="6" fill="rgba(0, 0, 0, 0.2)"/>
    <rect x="318" y="8" width="3" height="36" rx="1.5" fill="#6b7280"/>
    <text x="330" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#9ca3af">String 3</text>
    <text x="330" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#6b7280">Inaktiv</text>
  </g>

  <!-- ========================================== -->
  <!-- KPI STATS (AUTARKIE & EIGENVERBRAUCH) -->
  <!-- ========================================== -->
  <g transform="translate(35, 410)">
    <!-- 1. Autarkie Card -->
    <rect x="0" y="0" width="228" height="66" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <!-- Circular Ring (96%) -->
    <circle cx="34" cy="33" r="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4.5"/>
    <circle cx="34" cy="33" r="20" fill="none" stroke="#10b981" stroke-width="4.5" stroke-dasharray="120, 126" stroke-linecap="round" transform="rotate(-90 34 33)"/>
    <text x="34" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#10b981" text-anchor="middle">96%</text>
    <text x="68" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#9ca3af" letter-spacing="0.4">AUTARKIE HEUTE</text>
    <text x="68" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Sehr hoch 🌟</text>

    <!-- 2. Eigenverbrauch Card -->
    <rect x="242" y="0" width="228" height="66" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <!-- Circular Ring (78%) -->
    <circle cx="276" cy="33" r="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4.5"/>
    <circle cx="276" cy="33" r="20" fill="none" stroke="#06b6d4" stroke-width="4.5" stroke-dasharray="98, 126" stroke-linecap="round" transform="rotate(-90 276 33)"/>
    <text x="276" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#06b6d4" text-anchor="middle">78%</text>
    <text x="310" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#9ca3af" letter-spacing="0.4">EIGENVERBRAUCH</text>
    <text x="310" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">78.2% genutzt 🌿</text>
  </g>

  <!-- ========================================== -->
  <!-- DAILY TOTALS CHIPS -->
  <!-- ========================================== -->
  <g transform="translate(35, 490)">
    <!-- Chip 1: Erzeugung -->
    <rect x="0" y="0" width="108" height="46" rx="8" fill="rgba(0, 0, 0, 0.25)"/>
    <rect x="0" y="0" width="108" height="2.5" fill="#eab308"/>
    <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#9ca3af">Erzeugung</text>
    <text x="10" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#eab308">24.6 kWh</text>

    <!-- Chip 2: Verbrauch -->
    <rect x="120" y="0" width="108" height="46" rx="8" fill="rgba(0, 0, 0, 0.25)"/>
    <rect x="120" y="0" width="108" height="2.5" fill="#8b5cf6"/>
    <text x="130" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#9ca3af">Verbrauch</text>
    <text x="130" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#8b5cf6">8.4 kWh</text>

    <!-- Chip 3: Einspeisung -->
    <rect x="242" y="0" width="108" height="46" rx="8" fill="rgba(0, 0, 0, 0.25)"/>
    <rect x="242" y="0" width="108" height="2.5" fill="#10b981"/>
    <text x="252" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#9ca3af">Einspeisung</text>
    <text x="252" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#10b981">16.2 kWh</text>

    <!-- Chip 4: Netzbezug -->
    <rect x="362" y="0" width="108" height="46" rx="8" fill="rgba(0, 0, 0, 0.25)"/>
    <rect x="362" y="0" width="108" height="2.5" fill="#f97316"/>
    <text x="372" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#9ca3af">Netzbezug</text>
    <text x="372" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#f97316">0.8 kWh</text>
  </g>

  <!-- ========================================== -->
  <!-- QUICK CONTROL BUTTONS -->
  <!-- ========================================== -->
  <g transform="translate(35, 555)">
    <!-- Wintermodus Button (AUS) -->
    <rect x="0" y="0" width="228" height="40" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <!-- Snowflake Icon -->
    <g transform="translate(48, 12)">
      <path d="M 8,0 L 8,16 M 0,8 L 16,8 M 2,2 L 14,14 M 2,14 L 14,2" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="74" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e5e7eb">Wintermodus AUS</text>

    <!-- Schnellladung Button (AUS) -->
    <rect x="242" y="0" width="228" height="40" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <!-- Lightning Icon -->
    <g transform="translate(295, 12)">
      <path d="M 7,0 L 1,9 L 7,9 L 5,16 L 13,6 L 7,6 Z" fill="#9ca3af"/>
    </g>
    <text x="318" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e5e7eb">Schnellladung AUS</text>
  </g>
</svg>
