<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e26"/>
      <stop offset="100%" stop-color="#15151c"/>
    </linearGradient>

    <!-- Header Icon Gradient -->
    <linearGradient id="solar-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Node Glow Gradients -->
    <radialGradient id="solar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9800" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="batt-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f06292" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f06292" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="grid-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8353d1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8353d1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="house-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Main Card Container -->
  <rect x="15" y="15" width="510" height="650" rx="20" fill="url(#card-bg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- HEADER -->
  <g transform="translate(35, 35)">
    <rect x="0" y="0" width="34" height="34" rx="9" fill="url(#solar-icon-grad)"/>
    <path d="M 17,9 A 4,4 0 0,1 21,13 A 4,4 0 0,1 17,17 A 4,4 0 0,1 13,13 A 4,4 0 0,1 17,9 M 17,5 L 18.8,7.8 C 18.2,7.6 17.6,7.5 17,7.5 C 16.4,7.5 15.8,7.6 15.2,7.8 L 17,5 M 10,9 L 13.5,8.7 C 13,9.1 12.6,9.6 12.3,10.2 C 12,10.8 11.8,11.4 11.7,12 L 10,9 M 17,21 L 15.2,18.2 C 15.8,18.4 16.4,18.5 17,18.5 C 17.6,18.5 18.2,18.4 18.8,18.2 L 17,21" fill="#ffffff" />
    <text x="44" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff">LG ESS Solar</text>

    <!-- Status Pill -->
    <g transform="translate(315, 4)">
      <rect x="0" y="0" width="155" height="26" rx="13" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
      <circle cx="14" cy="13" r="4.5" fill="#10b981"/>
      <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#9ca3af">Normal • 50.0 Hz</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- ENERGY FLOW VISUALIZER (PERFECT SYMMETRY)  -->
  <!-- Width: 510 total, center at X = 270        -->
  <!-- Grid center at 270 - 170 = 100             -->
  <!-- Home center at 270 + 170 = 440             -->
  <!-- Solar center at 270, Y = 135               -->
  <!-- Battery center at 270, Y = 305             -->
  <!-- Grid/Home center at Y = 220                -->
  <!-- ========================================== -->
  <g id="flow-visualizer">
    <!-- Glows -->
    <circle cx="270" cy="135" r="48" fill="url(#solar-glow)"/>
    <circle cx="100" cy="220" r="48" fill="url(#grid-glow)"/>
    <circle cx="440" cy="220" r="48" fill="url(#house-glow)"/>
    <circle cx="270" cy="305" r="48" fill="url(#batt-glow)"/>

    <!-- Inactive Paths (Subtle) -->
    <!-- Grid to Home -->
    <path d="M 136,220 L 404,220" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" fill="none"/>
    <!-- Battery to Grid -->
    <path d="M 252,271 C 252,238 180,238 134,238" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" fill="none"/>
    <!-- Battery to Home -->
    <path d="M 288,271 C 288,238 360,238 406,238" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" fill="none"/>

    <!-- Active Paths -->
    <!-- Solar to Battery (Vertical) -->
    <path id="flow-solar-batt" d="M 270,171 L 270,269" stroke="#f06292" stroke-width="2.5" fill="none"/>

    <!-- Solar to Grid (Curve) -->
    <path id="flow-solar-grid" d="M 252,169 C 252,202 180,202 134,202" stroke="#8353d1" stroke-width="2.5" fill="none"/>

    <!-- Solar to Home (Curve) -->
    <path id="flow-solar-home" d="M 288,169 C 288,202 360,202 406,202" stroke="#ff9800" stroke-width="2.5" fill="none"/>

    <!-- Animated Particles (Exactly 1 round dot per line) -->
    <circle r="4.5" fill="#8353d1">
      <animateMotion dur="2.4s" repeatCount="indefinite" calcMode="linear">
        <mpath href="#flow-solar-grid"/>
      </animateMotion>
    </circle>

    <circle r="4.5" fill="#ff9800">
      <animateMotion dur="2.6s" repeatCount="indefinite" calcMode="linear">
        <mpath href="#flow-solar-home"/>
      </animateMotion>
    </circle>

    <circle r="4.5" fill="#f06292">
      <animateMotion dur="2.5s" repeatCount="indefinite" calcMode="linear">
        <mpath href="#flow-solar-batt"/>
      </animateMotion>
    </circle>

    <!-- ============================================== -->
    <!-- 1. SOLAR NODE (TOP CENTER) X=270, Y=135        -->
    <!-- ============================================== -->
    <g transform="translate(270, 135)">
      <circle cx="0" cy="0" r="36" fill="rgba(255, 152, 0, 0.12)" stroke="#ff9800" stroke-width="2.5"/>
      <!-- Sun Icon -->
      <path d="M 0,-14 A 5,5 0 0,1 5,-9 A 5,5 0 0,1 0,-4 A 5,5 0 0,1 -5,-9 A 5,5 0 0,1 0,-14 M 0,-21 L 1.8,-17.5 C 1.2,-17.8 0.6,-17.9 0,-17.9 C -0.6,-17.9 -1.2,-17.8 -1.8,-17.5 L 0,-21 M -8,-17 L -5,-15.5 M 8,-17 L 5,-15.5" stroke="#ff9800" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">4.85 kW</text>
      <text x="0" y="-45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ff9800" text-anchor="middle" letter-spacing="0.4">SOLAR</text>
    </g>

    <!-- ============================================== -->
    <!-- 2. GRID NODE (LEFT) X=100, Y=220               -->
    <!-- ============================================== -->
    <g transform="translate(100, 220)">
      <circle cx="0" cy="0" r="36" fill="rgba(131, 83, 209, 0.12)" stroke="#8353d1" stroke-width="2.5"/>
      <path d="M -7,-12 L 0,-16 L 7,-12 M -5,-7 L 5,-7 M -3,-1 L 3,-1 M 0,-16 L -5,3 M 0,-16 L 5,3" stroke="#8353d1" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <g transform="translate(-16, 7)">
        <path d="M 2,-3 L -2,0 L 2,3 M -2,0 L 5,0" stroke="#8353d1" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </g>
      <text x="5" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#8353d1" text-anchor="middle">2.10 kW</text>
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#8353d1" text-anchor="middle" letter-spacing="0.4">EINSPEISUNG</text>
    </g>

    <!-- ============================================== -->
    <!-- 3. HOME NODE (RIGHT) X=440, Y=220              -->
    <!-- ============================================== -->
    <g transform="translate(440, 220)">
      <circle cx="0" cy="0" r="36" fill="rgba(2, 132, 199, 0.12)" stroke="#0284c7" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="36" fill="none" stroke="#ff9800" stroke-width="3"/>
      <path d="M 0,-14 L -8,-7 L -5,-7 L -5,1 L 5,1 L 5,-7 L 8,-7 Z" fill="#38bdf8"/>
      <text x="0" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">1.30 kW</text>
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.4">VERBRAUCH</text>
    </g>

    <!-- ============================================== -->
    <!-- 4. BATTERY NODE (BOTTOM CENTER) X=270, Y=305   -->
    <!-- ============================================== -->
    <g transform="translate(270, 305)">
      <circle cx="0" cy="0" r="36" fill="rgba(240, 98, 146, 0.12)" stroke="#f06292" stroke-width="2.5"/>
      <g transform="translate(-16, -15)">
        <rect x="0" y="1" width="11" height="6" rx="1.5" fill="none" stroke="#f06292" stroke-width="1.2"/>
        <rect x="11" y="2.5" width="1.5" height="3" fill="#f06292"/>
        <text x="17" y="7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#f06292">82%</text>
      </g>
      <g transform="translate(-17, 9)">
        <path d="M 0,-3 L 0,4 M -3,1 L 0,4 L 3,1" stroke="#f06292" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </g>
      <text x="5" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#f06292" text-anchor="middle">1.45 kW</text>
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f06292" text-anchor="middle" letter-spacing="0.4">BATTERIE</text>
    </g>
  </g>

  <!-- PV STRINGS BAR -->
  <g transform="translate(35, 385)">
    <rect x="0" y="0" width="470" height="52" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <!-- String 1 -->
    <rect x="12" y="8" width="140" height="36" rx="6" fill="rgba(0, 0, 0, 0.2)"/>
    <rect x="12" y="8" width="3" height="36" rx="1.5" fill="#ff9800"/>
    <text x="24" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#9ca3af">String 1</text>
    <text x="24" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">2.45 kW</text>
    <text x="110" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#6b7280">340 V</text>

    <!-- String 2 -->
    <rect x="165" y="8" width="140" height="36" rx="6" fill="rgba(0, 0, 0, 0.2)"/>
    <rect x="165" y="8" width="3" height="36" rx="1.5" fill="#ff9800"/>
    <text x="177" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#9ca3af">String 2</text>
    <text x="177" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">2.40 kW</text>
    <text x="263" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#6b7280">335 V</text>

    <!-- String 3 -->
    <rect x="318" y="8" width="140" height="36" rx="6" fill="rgba(0, 0, 0, 0.2)"/>
    <rect x="318" y="8" width="3" height="36" rx="1.5" fill="#6b7280"/>
    <text x="330" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#9ca3af">String 3</text>
    <text x="330" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#6b7280">Inaktiv</text>
  </g>

  <!-- KPI STATS -->
  <g transform="translate(35, 450)">
    <!-- Autarkie Card -->
    <rect x="0" y="0" width="228" height="66" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <circle cx="34" cy="33" r="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4.5"/>
    <circle cx="34" cy="33" r="20" fill="none" stroke="#488fc2" stroke-width="4.5" stroke-dasharray="120, 126" stroke-linecap="round" transform="rotate(-90 34 33)"/>
    <text x="34" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#488fc2" text-anchor="middle">96%</text>
    <text x="68" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#9ca3af" letter-spacing="0.4">AUTARKIE HEUTE</text>
    <text x="68" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Sehr hoch 🌟</text>

    <!-- Eigenverbrauch Card -->
    <rect x="242" y="0" width="228" height="66" rx="12" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <circle cx="276" cy="33" r="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4.5"/>
    <circle cx="276" cy="33" r="20" fill="none" stroke="#4db6ac" stroke-width="4.5" stroke-dasharray="98, 126" stroke-linecap="round" transform="rotate(-90 276 33)"/>
    <text x="276" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#4db6ac" text-anchor="middle">78%</text>
    <text x="310" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#9ca3af" letter-spacing="0.4">EIGENVERBRAUCH</text>
    <text x="310" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">78.2% genutzt 🌿</text>
  </g>

  <!-- DAILY CHIPS -->
  <g transform="translate(35, 528)">
    <rect x="0" y="0" width="108" height="46" rx="8" fill="rgba(0, 0, 0, 0.25)"/>
    <rect x="0" y="0" width="108" height="2.5" fill="#ff9800"/>
    <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#9ca3af">Erzeugung</text>
    <text x="10" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#ff9800">24.6 kWh</text>

    <rect x="120" y="0" width="108" height="46" rx="8" fill="rgba(0, 0, 0, 0.25)"/>
    <rect x="120" y="0" width="108" height="2.5" fill="#0284c7"/>
    <text x="130" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#9ca3af">Verbrauch</text>
    <text x="130" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#38bdf8">8.4 kWh</text>

    <rect x="242" y="0" width="108" height="46" rx="8" fill="rgba(0, 0, 0, 0.25)"/>
    <rect x="242" y="0" width="108" height="2.5" fill="#488fc2"/>
    <text x="252" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#9ca3af">Einspeisung</text>
    <text x="252" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#488fc2">16.2 kWh</text>

    <rect x="362" y="0" width="108" height="46" rx="8" fill="rgba(0, 0, 0, 0.25)"/>
    <rect x="362" y="0" width="108" height="2.5" fill="#5a6fe8"/>
    <text x="372" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#9ca3af">Netzbezug</text>
    <text x="372" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#5a6fe8">0.8 kWh</text>
  </g>

  <!-- CONTROLS -->
  <g transform="translate(35, 586)">
    <rect x="0" y="0" width="228" height="40" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <g transform="translate(48, 12)">
      <path d="M 8,0 L 8,16 M 0,8 L 16,8 M 2,2 L 14,14 M 2,14 L 14,2" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="74" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e5e7eb">Wintermodus AUS</text>

    <rect x="242" y="0" width="228" height="40" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <g transform="translate(295, 12)">
      <path d="M 7,0 L 1,9 L 7,9 L 5,16 L 13,6 L 7,6 Z" fill="#9ca3af"/>
    </g>
    <text x="318" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e5e7eb">Schnellladung AUS</text>
  </g>
</svg>
